[project]
name = "study-gateway"
version = "1.0.0"
description = "FastAPI gateway for streaming AI answers and background document extraction"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.135.2", "uvicorn==0.42.0", "httpx==0.28.1",
  "pydantic==2.13.5", "python-multipart==0.0.22", "pypdf==6.10.0", "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "ruff==0.15.7", "flask==3.1.3"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
